<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💕 Bear & Shabs 💕</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Patrick Hand', cursive;
      background: #f6efe7;
      padding: 30px;
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
    }

    .paper {
      background: white;
      padding: 30px;
      max-width: 600px;
      margin: 40px auto;
      border-radius: 15px;
      box-shadow: 
        0 10px 25px rgba(0,0,0,0.2),
        0 0 0 10px #f3e5d8,
        0 0 0 20px #e8d8c3;
    }

    .counter {
      font-size: 20px;
      margin: 20px 0;
    }

    .mixtape {
      margin-top: 30px;
    }

    .timeline-input {
  margin: 20px 0;
}

.timeline-input input {
  display: block;
  width: 100%;
  margin-top: 8px;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.timeline {
  position: relative;
  margin-top: 40px;
  padding-left: 20px;
  border-left: 3px solid #d88c9a;
}

.timeline-event {
  background: white;
  padding: 15px;
  margin-bottom: 25px;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.15);
  position: relative;
  transform: rotate(-1deg);
}

.timeline-event:nth-child(even) {
  transform: rotate(1deg);
}

.timeline-event::before {
  content: "";
  width: 12px;
  height: 12px;
  background: #d88c9a;
  border-radius: 50%;
  position: absolute;
  left: -29px;
  top: 20px;
}

.timeline-event img {
  width: 100%;
  margin-top: 10px;
  border-radius: 10px;
}

    iframe {
      width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #d88c9a;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      font-size: 16px;
    }

    button:hover {
      background: #c06c84;
      transform: scale(1.05);
    }

  </style>
</head>

<body>

  <h1>💕 Bear & Shabs 💕</h1>

  <div class="paper">
    
    <div class="counter" id="relationshipCounter"></div>
<h2>📖 Our Timeline</h2>

<div class="timeline-input">
  <input type="date" id="timelineDate">
  <input type="text" id="timelineText" placeholder="What happened?">
  <input type="file" id="timelineImage" accept="image/*">
  <button onclick="addTimelineEvent()">Add Memory</button>
</div>

<div id="timelineContainer"></div>
    
    <div class="mixtape">
      <h2>🎶 Bear Mixtape</h2>
      <!-- Replace with your Spotify embed link -->
      <iframe src="https://open.spotify.com/embed/playlist/2oZwezqpZrSdhrW9nDy99G?utm_source=generator&theme=0"
              height="152"
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>
    </div>

    <a href="bucketlist.html">
      <button>🗺️ Our Travel Bucket List</button>
    </a>

    <a href="buck1.html">
      <button>📸 Memory Vault</button>
    </a>

    <a href="buck2.html">
      <button>📅 Memory Calendar</button>
    </a>
    
    <a href="mixtape.html">
  <button>🎵 Bear Mixtape Page</button>
</a>

  </div>

<script>
  function updateCounter() {
    const startDate = new Date("2025-06-07"); // CHANGE THIS
    const today = new Date();

    const diffTime = today - startDate;
    const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    document.getElementById("relationshipCounter").innerHTML =
      `💕 We've been together for <strong>${days}</strong> days 💕`;
  }

  updateCounter();
  const timelineContainer = document.getElementById("timelineContainer");

window.onload = function() {
  updateCounter();
  loadTimeline();
};

function addTimelineEvent() {
  const date = document.getElementById("timelineDate").value;
  const text = document.getElementById("timelineText").value;
  const imageInput = document.getElementById("timelineImage");

  if (!date || !text || !imageInput.files[0]) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    const event = {
      date,
      text,
      image: e.target.result
    };

    const events = JSON.parse(localStorage.getItem("timeline")) || [];
    events.push(event);

    localStorage.setItem("timeline", JSON.stringify(events));
    renderTimeline();
  };

  reader.readAsDataURL(imageInput.files[0]);
}

function loadTimeline() {
  renderTimeline();
}

function renderTimeline() {
  const events = JSON.parse(localStorage.getItem("timeline")) || [];
  timelineContainer.innerHTML = '<div class="timeline"></div>';
  const timeline = timelineContainer.querySelector(".timeline");

  events.sort((a,b) => new Date(a.date) - new Date(b.date));

  events.forEach(event => {
    const div = document.createElement("div");
    div.className = "timeline-event";
    div.innerHTML = `
      <strong>${event.date}</strong>
      <p>${event.text}</p>
      <img src="${event.image}">
    `;
    timeline.appendChild(div);
  });
}
</script>

</body>
</html>
